[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-calculator-backend"
version = "0.1.0"
description = "FastAPI backend for the web calculator: exact-decimal PEMDAS expression evaluation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Stage 3 Requirement 30: measure statement AND branch coverage of the
# application package only (``--cov=app`` keeps ``tests/`` out of the coverage
# denominator) and fail the run, reporting the unmet metric, whenever statement
# or branch coverage falls below 80%. ``term-missing`` prints the uncovered
# lines/branches so the unmet metric is visible in the run output.
addopts = "-ra --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Measure the application package only; tests are excluded from the denominator.
source = ["app"]
branch = true

[tool.coverage.report]
# Branch gate reconciled with the pytest ``--cov-fail-under`` option above: the
# combined run fails and reports the metric when statement OR branch coverage is
# under 80%. The Stage 2 Requirement 25.7 scientific-module gate (>=90% over
# scientific.py / constants.py and the scientific branches of the engine) is an
# additional, stricter check layered on top of this baseline, not a replacement;
# run it with, e.g.:
#   python -m pytest --cov=app.engine.scientific --cov=app.engine.constants \
#       --cov-branch --cov-fail-under=90
show_missing = true
fail_under = 80
