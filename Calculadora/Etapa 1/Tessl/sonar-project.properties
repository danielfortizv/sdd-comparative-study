# Core Configuration
sonar.projectKey=Tessl-Etapa1
sonar.projectName=Tessl-Etapa1
sonar.host.url=http://localhost:9000

# Define your source directories separated by a comma
sonar.sources=backend,frontend
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions (Crucial so you don't scan downloaded library files)
sonar.exclusions=**/node_modules/**, **/.venv/**, **/dist/**, **/build/**, **/*.spec.ts

# Language Specific settings (Optional)
sonar.sourceEncoding=UTF-8
