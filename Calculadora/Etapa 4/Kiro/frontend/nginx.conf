# Nginx config for the Frontend_Image (Requirement 32, 33.3).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the Evaluate_Endpoint to the backend service over the
    # shared Compose network, resolved by service name (Requirement 33.3).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: an unknown client-side route returns index.html (200) so
    # client-side routing resolves it; existing asset files are served as-is
    # (Requirements 32.3, 32.4).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
