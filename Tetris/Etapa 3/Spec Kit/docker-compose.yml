services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - TETRIS_DB_PATH=/app/data/high-scores.sqlite3
      - TETRIS_ALLOWED_ORIGINS=http://localhost:5183
    volumes:
      - tetris-high-scores-volume:/app/data
    expose:
      - "8000"
    # Keep the backend internal by not publishing port 8000 on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5183:5183"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:5183/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  tetris-high-scores-volume:
    name: tetris-high-scores-volume
