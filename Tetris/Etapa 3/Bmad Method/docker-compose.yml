name: tetris-stage3-bmad

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - TETRIS_DB_PATH=/app/data/high-scores.sqlite3
    volumes:
      - tetris-stage3-bmad-db:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/high-scores')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5183:5183"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5183/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tetris-stage3-bmad-db:
    name: tetris-stage3-bmad-db
