name: Tetris Stage 3 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock

      - name: Run pip-audit
        run: |
          pip-audit -r backend/requirements-dev.lock

      - name: Run Backend Tests with Coverage
        run: |
          cd backend
          PYTHONPATH=. pytest --cov=app --cov-report=xml --cov-report=term

  frontend:
    name: Frontend CI (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run Tests with Coverage
        run: |
          cd frontend
          npx vitest run --coverage

      - name: Run Production Build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t tetris-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t tetris-frontend:test ./frontend
