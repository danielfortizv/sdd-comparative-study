name: Tetris Studio Stage 3 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install Pinned Dependencies via uv.lock
        working-directory: ./backend
        run: |
          uv sync --frozen

      - name: Run Backend Unit Tests and Coverage
        working-directory: ./backend
        run: |
          uv run pytest --cov=app --cov-report=xml

      - name: Run Backend Dependency Security Audit
        working-directory: ./backend
        run: |
          uv run pip-audit

  frontend-ci:
    name: Frontend CI (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run TypeScript Linter Check
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run Frontend Unit & Component Tests
        working-directory: ./frontend
        run: |
          npm run test

      - name: Run Frontend Production Build Check
        working-directory: ./frontend
        run: |
          npm run build

      - name: Run Frontend Dependency Security Audit
        working-directory: ./frontend
        run: |
          npm audit

  docker-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Multi-Stage Container Builds
        run: |
          docker compose build
