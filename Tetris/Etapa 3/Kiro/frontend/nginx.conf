# nginx config for the frontend runtime image (Stage 3, Option A).
# Serves the production build and reverse-proxies /api to the backend service
# on the internal Docker network. Listens on 5183 so a non-root user can bind.

server {
    listen 5183;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend container over the internal network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
