# nginx config for the frontend runtime image (Stage 3, Option A).
# Serves the production build and reverse-proxies /api to the backend service
# on the internal Docker network. Listens on 5183 so a non-root user can bind.

server {
    listen 5183;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend container over the internal network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse-proxy the duel WebSocket to the SAME backend worker over the
    # internal network. The duel endpoint validates Origin against an EXACT
    # allow-list bound to the proxy host/port and binds on the real Host, so
    # this location preserves both Host (real host:port, including 5517) and
    # Origin unchanged; the app layer does the allow-list check, nginx does not
    # filter Origin. proxy_read_timeout/proxy_send_timeout sit comfortably above
    # the longest application retention (120s waiting/inactive, plus the 60s
    # playing idle timeout and 15s finished retention, and the 1s+1s cleanup
    # slack) so nginx never severs a live duel or a waiting room before the
    # app's own timeout fires.
    location /ws/duel {
        proxy_pass http://backend:8000/ws/duel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
    }
}
