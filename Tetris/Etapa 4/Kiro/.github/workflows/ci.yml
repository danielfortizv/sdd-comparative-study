# Continuous integration for Tetris Stage 3 (Option A).
#
# Ordinary unit / build / image checks only. Timing-sensitive performance
# checks live in perf.yml and are NEVER part of this pipeline (Req 16.7, 15.5).
# This file is a configuration artifact; its presence is not evidence of a
# hosted Actions run (Req 16.6). No private secrets are required (Req 16.4).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests, coverage, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin the Python MAJOR version used by the project (Req 16.2).
          python-version: "3.12"
      - name: Install dev/audit set from the RESOLVED dev lock (reproducible)
        run: |
          python -m pip install --upgrade pip
          # Reproducible install from the complete resolved DEV lock, which
          # pins every transitive and is a superset of requirements.lock.txt
          # (Req 16.3, 19.10). Input manifests: requirements.txt /
          # requirements-dev.txt; resolved locks: requirements.lock.txt /
          # requirements-dev.lock.txt.
          pip install --no-deps -r requirements-dev.lock.txt
      - name: pip check
        run: pip check
      - name: Backend tests with coverage (XML)
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - name: Dependency audit - runtime lock (report findings, no suppression)
        run: pip-audit -r requirements.lock.txt
      - name: Dependency audit - dev lock (report findings, no suppression)
        run: pip-audit -r requirements-dev.lock.txt

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pin the Node MAJOR version used by the project (Req 16.2).
          node-version: "24"
      - name: Install (reproducible, from committed lockfile)
        run: npm ci
      - name: Frontend tests with coverage
        run: npx vitest run --coverage
      - name: Production build
        run: npm run build
      - name: Dependency audit (report findings, no suppression)
        run: npm audit

  images:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (runtime set only; no dev deps)
        run: docker build -t tetris-stage3-kiro-backend ./backend
      - name: Build frontend image (production build; nginx runtime)
        run: docker build -t tetris-stage3-kiro-frontend ./frontend
