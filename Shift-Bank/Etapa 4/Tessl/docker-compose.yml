services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftbank-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/shift_bank.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?AUDIT_SECRET_KEY is required}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY is required}
      - RUN_SCHEDULER=true
    volumes:
      - shiftbank_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiftbank-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  shiftbank_data:
    name: shiftbank_data
