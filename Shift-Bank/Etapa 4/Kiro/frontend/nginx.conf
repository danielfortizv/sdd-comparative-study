# nginx.conf de Shift Bank (Etapa 3, Tarea 26).
#
# Decisión D-E3-04 (despliegue local con Docker Compose; TLS termina en Nginx; reverse-proxy;
# redirección HTTP->HTTPS; red interna; solo verificación local). Diseño §1.7, §4.1, §4.2.
#
# Este server:
#   - Termina HTTPS en 443 usando certificados MONTADOS externamente (no horneados en la imagen;
#     ver .dockerignore). Rutas de cert/clave bajo /etc/nginx/certs/ (volumen/bind de Compose).
#   - Redirige todo el tráfico HTTP (80) a HTTPS con 301 (R4.2, AC-12).
#   - Sirve los assets estáticos del build de Vite desde /usr/share/nginx/html con fallback SPA
#     a index.html (enrutamiento de cliente).
#   - Hace reverse-proxy de /api al backend por la red interna de Docker Compose
#     (`proxy_pass http://backend:8000;`). El nombre de upstream `backend` se resuelve por el DNS
#     interno de Compose y se cablea en el docker-compose.yml (Tarea 27). El backend NO publica
#     puertos al host (R11.2): solo es alcanzable por esta red interna.
#
# El frontend usa un origen RELATIVO para la API (ver src/api/client.ts), así el navegador llama
# a https://<host>/api/... (mismo origen que la página) y Nginx reenvía esas peticiones al
# backend. No se baja TLS entre Nginx y el backend porque el tramo va por la red interna aislada
# (diseño §1.7).

# ---------------------------------------------------------------------------
# Server 80: redirección permanente a HTTPS (R4.2).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirección 301 de HTTP a HTTPS, preservando host y ruta solicitada.
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Server 443: terminación TLS + assets estáticos + reverse-proxy de /api.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificado y clave MONTADOS externamente (Tarea 27/28). Nunca horneados en la imagen
    # (R4.4): el .dockerignore excluye *.pem/*.key/*.crt y certs/. Rutas bajo el punto de montaje.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Endurecimiento TLS básico (solo protocolos modernos).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Raíz de los assets estáticos del build de Vite (copiados en la etapa de build del
    # Dockerfile multistage a /usr/share/nginx/html).
    root  /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy de la API al backend por la red interna de Compose (R4.3, R11.1/R11.2).
    # El prefijo /api se preserva tal cual: el backend monta todas sus rutas bajo /api
    # (routers con prefix="/api"). Por eso NO se reescribe la ruta.
    location /api/ {
        proxy_pass http://backend:8000;

        # Cabeceras estándar para que el backend vea el host/origen y esquema reales.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # https (TLS terminó en Nginx)
        proxy_set_header X-Forwarded-Host  $host;

        # HTTP/1.1 explícito hacia el upstream (keep-alive correcto).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # No se cachean respuestas de API.
        proxy_buffering off;
    }

    # SPA: servir el archivo solicitado si existe; si no, caer a index.html para que el
    # enrutamiento del lado del cliente funcione con rutas profundas (recarga directa).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
