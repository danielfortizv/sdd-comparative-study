events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==============================================================================
    # 1. HTTP Server: Port 80 -> Redirect to HTTPS Port 8443 (FR-028, Scenario 4.2)
    # ==============================================================================
    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP requests to host HTTPS port 8443
        return 301 https://$host:18443$request_uri;
    }

    # ==============================================================================
    # 2. HTTPS Server: Port 443 (TLS Termination, React SPA, /api Reverse Proxy)
    # ==============================================================================
    server {
        listen 443 ssl;
        server_name localhost;

        # TLS Development Certificate Configuration (FR-028, Scenario 4.3)
        ssl_certificate     /etc/nginx/certs/localhost_cert.pem;
        ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Static React SPA assets
        root  /usr/share/nginx/html;
        index index.html;

        # Reverse proxy for backend REST API (FR-029, Scenario 4.4)
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Static assets routing with Single Page Application fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
