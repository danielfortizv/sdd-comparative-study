name: shift-bank-e3-openspec-block4

services:
  storage-init:
    image: shift-bank-e3-openspec-backend:local
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    user: "0:0"
    command: ["python", "-c", "import os; os.chown('/var/lib/shift-bank', 10001, 10001)"]
    restart: "no"
    volumes:
      - banking-data:/var/lib/shift-bank
    networks:
      - banking

  backend:
    image: shift-bank-e3-openspec-backend:local
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    container_name: shift-bank-e3-openspec-block4-backend
    depends_on:
      storage-init:
        condition: service_completed_successfully
    env_file:
      - ./.env.local
    environment:
      SHIFT_BANK_DB: ${SHIFT_BANK_DB:-/var/lib/shift-bank/bank.db}
      SHIFT_BANK_TRUSTED_PROXY_IPS: 172.29.240.2
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - banking-data:/var/lib/shift-bank
    networks:
      banking:
        ipv4_address: 172.29.240.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6

  frontend:
    image: shift-bank-e3-openspec-frontend:local
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    container_name: shift-bank-e3-openspec-block4-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18443:8443"
    restart: unless-stopped
    secrets:
      - tls_cert
      - tls_key
    networks:
      banking:
        ipv4_address: 172.29.240.2
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/secrets/tls_cert", "https://localhost:8443/health/ready", "-o", "/dev/null"]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6

volumes:
  banking-data:
    name: shift-bank-e3-openspec-block4-data

networks:
  banking:
    name: shift-bank-e3-openspec-block4-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.240.0/24

secrets:
  tls_cert:
    file: ${TLS_CERT_PATH:?TLS_CERT_PATH must reference a local development certificate}
  tls_key:
    file: ${TLS_KEY_PATH:?TLS_KEY_PATH must reference a local development private key}
