name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: ecommerce
          RABBITMQ_DEFAULT_PASS: stage4-demo
          RABBITMQ_DEFAULT_VHOST: stage4_openspec
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest pytest-cov httpx

    - name: Run Backend Tests with Coverage
      run: |
        cd backend
        pytest --cov=app --cov-report=xml
      env:
        DATABASE_URL: "sqlite:///./test_ecommerce.db"
        AMQP_URL: "amqp://ecommerce:stage4-demo@127.0.0.1:5672/stage4_openspec"
        PYTHONPATH: .

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Frontend Tests with Coverage
      run: |
        cd frontend
        npm run test

    - name: Build Frontend for Production
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: "http://127.0.0.1:18000"

    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Start Application Servers for E2E Tests
      run: |
        # Start the four actual microservices in the background from backend directory
        cd backend
        
        python -m app.identity.main > identity.log 2>&1 &
        echo $! > .pid_identity
        
        python -m app.commerce.main > commerce.log 2>&1 &
        echo $! > .pid_commerce
        
        python -m app.reviews.main > reviews.log 2>&1 &
        echo $! > .pid_reviews
        
        # Allow individual services a brief moment to bind to ports before starting Gateway
        sleep 2
        
        python -m app.gateway.main > gateway.log 2>&1 &
        echo $! > .pid_gateway
        
        # Start Frontend Vite preview server in the background on port 18100
        cd ../frontend
        npx vite preview --port 18100 --host 127.0.0.1 > ../frontend_preview.log 2>&1 &
        echo $! > ../.pid_frontend
        
        # Wait for all backends, the gateway, and frontend to be fully up and responsive
        if ! npx wait-on http://127.0.0.1:18001/health http://127.0.0.1:18002/health http://127.0.0.1:18003/health http://127.0.0.1:18000/health http://127.0.0.1:18100/ -t 30000; then
          echo "=== Error: Startup timed out! Service Logs: ==="
          echo "=== Identity Log ==="
          cat ../backend/identity.log || true
          echo "=== Commerce Log ==="
          cat ../backend/commerce.log || true
          echo "=== Reviews Log ==="
          cat ../backend/reviews.log || true
          echo "=== Gateway Log ==="
          cat ../backend/gateway.log || true
          echo "=== Frontend Preview Log ==="
          cat ../frontend_preview.log || true
          exit 1
        fi
        echo "All application servers started successfully!"
      env:
        AMQP_URL: "amqp://ecommerce:stage4-demo@127.0.0.1:5672/stage4_openspec"
        EVENT_NAMESPACE: "stage4.openspec"
        IDENTITY_DATABASE_URL: "sqlite:///./identity.db"
        COMMERCE_DATABASE_URL: "sqlite:///./commerce.db"
        REVIEWS_DATABASE_URL: "sqlite:///./reviews.db"
        IDENTITY_SERVICE_URL: "http://127.0.0.1:18001"
        COMMERCE_SERVICE_URL: "http://127.0.0.1:18002"
        REVIEWS_SERVICE_URL: "http://127.0.0.1:18003"
        IDENTITY_PORT: 18001
        COMMERCE_PORT: 18002
        REVIEWS_PORT: 18003
        GATEWAY_PORT: 18000
        PYTHONPATH: .

    - name: Run Playwright End-to-End Tests
      run: |
        cd frontend
        npm run test:e2e

    - name: Teardown Application Servers
      if: always()
      run: |
        echo "Teardown Stage 4 microservices stack..."
        cd backend
        for file in .pid_*; do
          if [ -f "$file" ]; then
            pid=$(cat "$file")
            echo "Stopping process $pid..."
            kill -9 "$pid" 2>/dev/null || true
            rm "$file"
          fi
        done
        if [ -f ../.pid_frontend ]; then
          pid=$(cat ../.pid_frontend)
          echo "Stopping frontend process $pid..."
          kill -9 "$pid" 2>/dev/null || true
          rm ../.pid_frontend
        fi
        echo "Teardown complete."

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        if-no-files-found: ignore
