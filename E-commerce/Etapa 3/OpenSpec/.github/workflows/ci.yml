name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest pytest-cov httpx

    - name: Run Backend Tests with Coverage
      run: |
        cd backend
        pytest --cov=app --cov-report=xml
      env:
        DATABASE_URL: "sqlite:///./test_ecommerce.db"

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Frontend Tests with Coverage
      run: |
        cd frontend
        npm run test

    - name: Build Frontend for Production
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: "http://127.0.0.1:8005"

    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Start Application Servers for E2E Tests
      run: |
        # Start FastAPI backend in the background
        cd backend
        python -m uvicorn app.main:app --host 127.0.0.1 --port 8005 &
        
        # Start Frontend Vite preview server in the background
        cd ../frontend
        npx vite preview --port 5173 --host 127.0.0.1 &
        
        # Wait for both servers to be fully up and responsive
        npx wait-on http://127.0.0.1:8005/api/products http://127.0.0.1:5173/ -t 30000
      env:
        DATABASE_URL: "sqlite:///./ecommerce.db"

    - name: Run Playwright End-to-End Tests
      run: |
        cd frontend
        npm run test:e2e

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        if-no-files-found: ignore
