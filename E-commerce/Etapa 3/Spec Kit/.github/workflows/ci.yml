name: Continuous Integration

on:
  push:
    branches: [ main, master, '003-delivery-caching' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Unit Test and E2E Verify
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python Environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install and run Backend Unit Tests
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Backend Pytest with Coverage
        run: |
          cd backend
          python -m pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term

      # 4. Set up Node Environment
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # 5. Install and run Frontend Unit Tests & Production Build
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Jest with Coverage
        run: |
          cd frontend
          npm run test:coverage

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm run build

      # 6. Install and run Playwright E2E Tests
      - name: Install E2E Dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd e2e
          npx playwright install --with-deps chromium

      - name: Start Backend Server in Background
        run: |
          cd backend
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 &
        env:
          PYTHONPATH: .

      - name: Start Frontend Server in Background
        run: |
          cd frontend
          npm start &

      - name: Wait for Local Servers to be Available
        run: |
          npx wait-on http://127.0.0.1:8000/api/products http://localhost:3000 --timeout 60000

      - name: Execute Playwright E2E Suite
        run: |
          cd e2e
          npx playwright test

      # 7. Upload Backend Coverage Artifact
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

      # 8. Upload Frontend Coverage Artifact
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      # 9. Upload Playwright Report on Failure
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
